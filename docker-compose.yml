services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: atlas-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
